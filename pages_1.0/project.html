<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- For a favicon.ico in the root folder -->
    <link rel="icon" type="image/x-icon" href="icon/wind.ico">
    <title>jlee</title>
    <style>
        @font-face {
            font-family: 'JetBrainsMono';
            src: url('../fonts/JetBrainsMonoNerdFont-Light.ttf') format('truetype');
        }
    
        body {
            font-family: 'JetBrainsMono';
            text-align: center;
            overflow-x: hidden;
            overflow-y: auto;
        }
    
        h1 {
            padding: 1.5rem;
            font-family: 'JetBrainsMono';
            font-size: 25px;
            text-align: center;
        }
    
        .navbar {
            display: flex;
            justify-content: center; /* centers horizontally */
            gap: 2.5rem;             /* spacing between links */
            /*background-color: #111; */
            padding: 2rem;
            text-align: center;
        }
        .navbar a {
            color: rgb(20, 2, 2);
            text-decoration: none;
            font-family: 'JetBrainsMono', sans-serif;
            font-size: 19px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columns */
            gap: 2rem;                            /* space between images */
            justify-items: center;                  /* centers each image */
            padding: 1rem;
        }
        
        .image-grid img {
            width: 100%;
            max-width: 300px;  /* control image size */
            border-radius: 10px;
            object-fit: cover; /* keep proportions */
        }

        .ascii-wrapper {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2.5rem;
          padding: 2rem 1rem 4rem;
        }

        /* Cat styling */
        .cat {
          font-family: monospace;
          font-size: 18px;
          white-space: pre;
          display: inline-block;
          animation: spin3D 6s linear infinite;
          transform-style: preserve-3d;
          text-align: left;
          margin: 0;
        }

        /* 3D rotation keyframes */
        @keyframes spin3D {
          0% {
            transform: rotateX(0deg) rotateY(0deg);
          }
          25% {
            transform: rotateX(180deg) rotateY(0deg);
          }
          50% {
            transform: rotateX(180deg) rotateY(180deg);
          }
          75% {
            transform: rotateX(0deg) rotateY(180deg);
          }
          100% {
            transform: rotateX(0deg) rotateY(360deg);
          }
        }
        /* Optional: a small stage to give perspective */
        .stage {
          perspective: 800px;
          display: inline-block;
          margin: 0 auto;
        }

        /* ASCII cube */
        .cube {
          font-family: monospace;
          white-space: pre;
          line-height: 1.05;        /* keeps the cube tight */
          letter-spacing: 0.5px;    /* nudges spacing for nicer proportions */
          display: inline-block;
          transform-style: preserve-3d;
          animation: cubeSpin 7s ease-in-out infinite alternate;
          user-select: none;
          font-size: 18px;
        }

        /* Smooth 3D spin in place */
        @keyframes cubeSpin {
          0%   { transform: rotateX(0deg)   rotateY(0deg); }
          50%  { transform: rotateX(20deg)  rotateY(180deg); }
          100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        @media (max-width: 600px) {
          .cat { font-size: 16px; }
          .cube { font-size: 16px; }
        }

    </style>
</head>

<body>
    <div>
        <nav class="navbar">
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="project.html">Projects</a>
        </nav>
        <div class="content">
            <br>
            <br>
            <h1>Projects</h1>
            <p>under construction.</p>
        </div>
    </div>

</body>

</html>
